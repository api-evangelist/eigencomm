name: eigencomm
description: >-
  Shanghai Eigencomm Technology Co., Ltd. is a fabless semiconductor company founded in 2017 and
  headquartered in the Zhangjiang district of Shanghai, China, dedicated to the research, design, and
  sale of cellular Internet of Things (IoT) communication chipsets and their supporting software. Eigencomm
  has mass-produced NB-IoT and Cat.1bis chip series that power smart meters, smart security, mobile payment,
  shared devices, asset trackers, charging piles, wearables, smart firefighting, and smart home appliances,
  and is developing 5G silicon. The company is backed by SoftBank Vision Fund II, Qiming Venture Partners,
  and others, having raised roughly USD 171M across multiple rounds. It was added to the API Evangelist
  network as a portfolio-lead stub; it publishes no public web API, developer portal, or OpenAPI at this time.
